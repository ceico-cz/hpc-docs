INHERIT: nav.yml

site_name: CEICO HPC Services
site_url: https://hpc.ceico.cz/
site_description: User documentation for HPC services provided to members of the CEICO project at the Institute of Physics (FZU) of the Czech Academy of Sciences
site_author: CEICO, Institute of Physics (FZU) of the Czech Academy of Sciences
copyright: >-
  <a href="https://www.fzu.cz/ceico">CEICO</a> – Central European Institute for Cosmology and Fundamental Physics,
  Institute of Physics (FZU) of the Czech Academy of Sciences · content licensed CC0

repo_url: https://github.com/ceico-cz/hpc-docs
repo_name: ceico-cz/hpc-docs
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: overrides
  logo: assets/ceico-logo-negative.svg
  favicon: assets/ceico-icon.svg
  font:
    text: Wix Madefor Text
    code: Roboto Mono
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme)"
      toggle: { icon: material/brightness-auto, name: Switch to light mode }
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: { icon: material/brightness-7, name: Switch to dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/brightness-4, name: Switch to system preference }
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.path
    - navigation.top
    - navigation.footer
    - navigation.instant
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - content.action.edit
    - content.tooltips
    - toc.follow

plugins:
  - search
  - privacy          # self-host Google Fonts and other external assets
  - glightbox:
      skip_classes: [off-glb]
      zoomable: true
      draggable: false
  - tags
  - redirects:
      redirect_maps:     # moved pages; old Wiki.js /en/ URLs are added by hooks/wikijs_redirects.py
        # Admin section restructure (2026-09)
        admin-stuff.md: admin/index.md
        en/admin-stuff.md: admin/index.md
        admin-stuff/Slurm_accoounting_admin_notes.md: admin/slurm-accounting.md
        en/admin-stuff/Slurm_accoounting_admin_notes.md: admin/slurm-accounting.md
        admin-stuff/Slurm_admin_snippets.md: admin/slurm-snippets.md
        en/admin-stuff/Slurm_admin_snippets.md: admin/slurm-snippets.md
        cuda-system-considerations.md: admin/cuda.md
        en/cuda-system-considerations.md: admin/cuda.md
        admin-stuff/add_LVM_volume_into_existing_layout.md: admin/lvm-volume.md
        en/admin-stuff/add_LVM_volume_into_existing_layout.md: admin/lvm-volume.md
        admin-stuff/Advantech_USB-5855_in_Ubuntu_23.md: admin/advantech-usb-5855.md
        en/admin-stuff/Advantech_USB-5855_in_Ubuntu_23.md: admin/advantech-usb-5855.md
        admin-stuff/Build_cosmosis_with_Python27.md: app/cosmosis-py27.md
        en/admin-stuff/Build_cosmosis_with_Python27.md: app/cosmosis-py27.md

hooks:
  - hooks/wikijs_redirects.py
  - hooks/last_updated.py

extra_css:
  - assets/extra.css

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.blocks.caption
  - pymdownx.caret        # ^superscript^
  - pymdownx.tilde        # ~subscript~ and ~~strike~~
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
